name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
            host: x86_64-unknown-linux-gnu
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
            host: aarch64-unknown-linux-gnu
          - target: macos-x86_64
            runner: macos-15-intel
            host: x86_64-apple-darwin
          - target: macos-aarch64
            runner: macos-15
            host: aarch64-apple-darwin
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      NATIVE_TARGET: ${{ matrix.target }}
      EXPECTED_HOST: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare runner storage
        run: |
          set -euo pipefail
          for pair in CARGO_HOME=cargo-home CARGO_TARGET_DIR=cargo-target RUSTUP_HOME=rustup-home TMPDIR=scratch XDG_CACHE_HOME=cache; do
            name="${pair%%=*}"
            path="$RUNNER_TEMP/${pair#*=}"
            mkdir -p "$path"
            printf '%s=%s\n' "$name" "$path" >> "$GITHUB_ENV"
          done
          mkdir -p "$RUNNER_TEMP/delivery"
          python3 -B - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          for name in ('cargo-home', 'cargo-target', 'rustup-home', 'scratch', 'cache'):
              path = (root / name).resolve(strict=True)
              assert path.is_relative_to(root) and path.stat().st_dev == root.stat().st_dev
              print(path)
          PY
          git rev-parse HEAD
          uname -a
          df -h "$RUNNER_TEMP"

      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: clippy,rustfmt

      - name: Verify native host and Cargo target
        run: |
          set -euo pipefail
          rustc -Vv
          test "$(rustc -Vv | sed -n 's/^host: //p')" = "$EXPECTED_HOST"
          cargo metadata --locked --no-deps --format-version 1 | python3 -B -c \
            'import json,os,sys; assert json.load(sys.stdin)["target_directory"] == os.environ["CARGO_TARGET_DIR"]'

      - name: Formatting and strict Clippy
        run: |
          set -euo pipefail
          cargo fmt --all -- --check > "$RUNNER_TEMP/delivery/format.stdout" 2> "$RUNNER_TEMP/delivery/format.stderr"
          cargo clippy --locked --all-targets --all-features -- -D warnings \
            > "$RUNNER_TEMP/delivery/clippy.stdout" 2> "$RUNNER_TEMP/delivery/clippy.stderr"
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --no-deps --all-features \
            > "$RUNNER_TEMP/delivery/rustdoc.stdout" 2> "$RUNNER_TEMP/delivery/rustdoc.stderr"

      - name: Full debug suite
        run: cargo test --locked --all-targets --all-features > "$RUNNER_TEMP/delivery/debug.stdout" 2> "$RUNNER_TEMP/delivery/debug.stderr"

      - name: Full release suite
        run: cargo test --release --locked --all-targets --all-features > "$RUNNER_TEMP/delivery/release.stdout" 2> "$RUNNER_TEMP/delivery/release.stderr"

      - name: Verify complete source package
        run: |
          set -euo pipefail
          cargo metadata --locked --no-deps --format-version 1 > "$RUNNER_TEMP/delivery/package-metadata.json"
          cargo package --locked --list > "$RUNNER_TEMP/delivery/package-files.txt"
          cargo package --locked > "$RUNNER_TEMP/delivery/package.stdout" 2> "$RUNNER_TEMP/delivery/package.stderr"
          python3 -B scripts/delivery.py source > "$RUNNER_TEMP/delivery/source.stdout" 2> "$RUNNER_TEMP/delivery/source.stderr"

      - name: Test packaged release
        run: >-
          cargo test --manifest-path "$PACKAGE_DIRECTORY/Cargo.toml" --release --locked --all-targets --all-features
          > "$RUNNER_TEMP/delivery/packaged-release.stdout" 2> "$RUNNER_TEMP/delivery/packaged-release.stderr"

      - name: Install and exercise packaged binary
        run: |
          set -euo pipefail
          cargo install --path "$PACKAGE_DIRECTORY" --locked --root "$RUNNER_TEMP/installed" \
            > "$RUNNER_TEMP/delivery/install.stdout" 2> "$RUNNER_TEMP/delivery/install.stderr"
          python3 -B "$PACKAGE_DIRECTORY/scripts/delivery.py" smoke --binary "$RUNNER_TEMP/installed/bin/rsomics-ecology" \
            > "$RUNNER_TEMP/delivery/smoke.stdout" 2> "$RUNNER_TEMP/delivery/smoke.stderr"

      - name: Assemble native delivery candidate
        run: >-
          python3 -B scripts/delivery.py bundle --binary "$RUNNER_TEMP/installed/bin/rsomics-ecology"
          > "$RUNNER_TEMP/delivery/bundle.stdout" 2> "$RUNNER_TEMP/delivery/bundle.stderr"

      - name: Retain source and native delivery candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsomics-ecology-delivery-${{ matrix.target }}-${{ github.sha }}
          path: ${{ runner.temp }}/delivery/
          if-no-files-found: error
          retention-days: 90
