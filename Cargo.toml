[package]
name = "rsomics-ecology"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false
license = "MIT OR Apache-2.0"
description = "Private development of sparse count-table ecological diversity workflows"
authors = ["Zane Leong <efd@live.com>"]
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
rayon = "1"
rsomics-common = "=0.12.3"
rsomics-help = "=0.4.0"
rsomics-phylo-tree = "=0.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
